services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: voicecore
      POSTGRES_USER: voicecore
      POSTGRES_PASSWORD: voicecore_dev
    ports:
      - "5432:5432"
    volumes:
      - voicecore_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U voicecore -d voicecore"]
      interval: 3s
      timeout: 3s
      retries: 20

  voicecore:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://voicecore:voicecore_dev@postgres:5432/voicecore
      PORT: 3000
      DEV_MODE: "true"
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  voicecore_pg:
